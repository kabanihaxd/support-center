<app-auth-layout>
  <div class="heading">
    <h1>Create your account</h1>
    <p class="muted">Register as a customer to submit and track support requests.</p>
  </div>

  <form class="form-grid" [formRoot]="form" aria-label="Create account">
    @if (serverError(); as error) {
      <div class="alert" role="alert">
        <app-icon name="circle-alert" [size]="16" />
        {{ error }}
      </div>
    }

    <div class="row">
      <div class="field">
        <label class="field-label" for="reg-name">Full name</label>
        <input
          id="reg-name"
          class="input"
          autocomplete="name"
          [formField]="form.name"
          aria-describedby="reg-name-error"
          [attr.aria-invalid]="form.name().touched() && form.name().invalid()"
        />
        <app-field-errors id="reg-name-error" [state]="form.name()" />
      </div>

      <div class="field">
        <label class="field-label" for="reg-company">Company <span class="muted">(optional)</span></label>
        <input
          id="reg-company"
          class="input"
          autocomplete="organization"
          [formField]="form.company"
          aria-describedby="reg-company-error"
          [attr.aria-invalid]="form.company().touched() && form.company().invalid()"
        />
        <app-field-errors id="reg-company-error" [state]="form.company()" />
      </div>
    </div>

    <div class="field">
      <label class="field-label" for="reg-email">Work email</label>
      <input
        id="reg-email"
        class="input"
        type="email"
        autocomplete="email"
        placeholder="you@company.com"
        [formField]="form.email"
        aria-describedby="reg-email-error"
        [attr.aria-invalid]="form.email().touched() && form.email().invalid()"
      />
      <app-field-errors id="reg-email-error" [state]="form.email()" />
    </div>

    <div class="field">
      <label class="field-label" for="reg-password">Password</label>
      <div class="password">
        <input
          id="reg-password"
          class="input"
          autocomplete="new-password"
          [type]="showPassword() ? 'text' : 'password'"
          [formField]="form.password"
          aria-describedby="reg-password-hint reg-password-error"
          [attr.aria-invalid]="form.password().touched() && form.password().invalid()"
        />
        <button
          type="button"
          class="icon-btn reveal"
          [attr.aria-label]="showPassword() ? 'Hide passwords' : 'Show passwords'"
          [attr.aria-pressed]="showPassword()"
          (click)="showPassword.set(!showPassword())"
        >
          <app-icon [name]="showPassword() ? 'eye-off' : 'eye'" [size]="16" />
        </button>
      </div>
      <span id="reg-password-hint" class="field-hint">At least 8 characters with a letter and a number.</span>
      <app-field-errors id="reg-password-error" [state]="form.password()" />
    </div>

    <div class="field">
      <label class="field-label" for="reg-confirm">Confirm password</label>
      <input
        id="reg-confirm"
        class="input"
        autocomplete="new-password"
        [type]="showPassword() ? 'text' : 'password'"
        [formField]="form.confirmPassword"
        aria-describedby="reg-confirm-error"
        [attr.aria-invalid]="form.confirmPassword().touched() && form.confirmPassword().invalid()"
      />
      <app-field-errors id="reg-confirm-error" [state]="form.confirmPassword()" />
    </div>

    <button type="submit" class="btn btn-primary btn-block submit" [disabled]="form().submitting()">
      @if (form().submitting()) {
        <app-icon name="loader" [size]="16" class="spin" />
        Creating account…
      } @else {
        Create account
      }
    </button>
  </form>

  <p class="switch muted">
    Already have an account? <a routerLink="/login">Sign in</a>
  </p>
</app-auth-layout>
