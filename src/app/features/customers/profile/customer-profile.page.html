<div class="page">
  <a class="back" routerLink="/customers">
    <app-icon name="arrow-left" [size]="16" />
    Back to customers
  </a>

  @if (loading() && !customer()) {
    <div aria-busy="true" class="loading">
      <span class="sr-only">Loading profile…</span>
      <span class="skeleton" style="height: 120px"></span>
      <span class="skeleton" style="height: 100px"></span>
    </div>
  } @else if (customer(); as c) {
    <app-profile-header [user]="c">
      @if (auth.can('ticket.create')) {
        <a class="btn btn-primary" routerLink="/tickets/new" [queryParams]="{ customer: c.id }">
          <app-icon name="plus" [size]="16" />
          New ticket
        </a>
      }
      @if (actions.canManage(c)) {
        <button type="button" class="btn btn-secondary" (click)="actions.openEdit(c)">
          <app-icon name="pencil" [size]="16" />
          Edit
        </button>
        <button
          type="button"
          class="btn btn-secondary"
          [class.danger]="c.active"
          [disabled]="actions.toggling() === c.id"
          (click)="actions.toggleActive(c)"
        >
          <app-icon [name]="c.active ? 'user-x' : 'user-check'" [size]="16" />
          {{ c.active ? 'Deactivate' : 'Activate' }}
        </button>
      }
    </app-profile-header>

    <section class="stats" aria-label="Ticket statistics">
      <app-stat-card label="Total tickets" [value]="stats().total" icon="ticket" />
      <app-stat-card label="Active" [value]="activeCount()" icon="activity" tone="violet" />
      <app-stat-card label="Resolved / closed" [value]="stats().resolved + stats().closed" icon="circle-check" tone="green" />
      <app-stat-card label="Avg. resolution time" [value]="avgResolution()" icon="timer" tone="gray" />
    </section>

    <app-person-tickets
      heading="Ticket history"
      emptyMessage="This customer hasn't submitted any tickets yet."
      [tickets]="tickets()"
      [loading]="loading()"
    />
  } @else {
    <div class="card">
      <app-empty-state icon="search" title="Customer not found" message="The customer may have been removed or the link is incorrect.">
        <a class="btn btn-secondary" routerLink="/customers">Back to customers</a>
      </app-empty-state>
    </div>
  }
</div>

<app-user-form-dialog
  [open]="actions.dialogOpen()"
  [mode]="actions.mode()"
  [user]="actions.target()"
  [saving]="actions.saving()"
  [error]="actions.error()"
  (save)="actions.save($event)"
  (closed)="actions.close()"
/>
