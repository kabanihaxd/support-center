<!doctype html>
<html lang="en" data-theme="light">
<head>
  <meta charset="utf-8">
  <title>SupportCenter</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="SupportCenter — IT support ticket management for admins, agents and customers.">
  <meta name="theme-color" content="#2563eb">
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script>
    // Ставим тему до загрузки Angular, чтобы не было вспышки светлой темы
    (function () {
      try {
        var pref = JSON.parse(localStorage.getItem('sc:theme') || 'null');
        var system = window.matchMedia('(prefers-color-scheme: dark)').matches;
        var dark = pref === 'dark' || (pref === 'system' && system);
        document.documentElement.dataset.theme = dark ? 'dark' : 'light';
      } catch (e) {}
    })();
  </script>
</head>
<body>
  <app-root></app-root>
</body>
</html>
